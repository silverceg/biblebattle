<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0B1426" />
<meta name="mobile-web-app-capable" content="yes" />
<title>성경 배틀</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap');
@import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/BMJUA.css');
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css');
:root{
  --bg:#0B1426; --bg2:#152540; --panel:#1B2D4F; --panel2:#24396A; --line:#0A0F1E;
  --yellow:#FFC93C; --orange:#FF7A1A; --blue:#2FA4FF; --green:#3DD68C; --red:#FF4757; --purple:#9B5CFF; --teal:#2ED3C6;
  --white:#FFFFFF; --dim:#8FA3C8;
  --dp:'Black Han Sans','BMJUA','Pretendard',system-ui,sans-serif;
  --ui:'Pretendard',system-ui,-apple-system,sans-serif;
  --safeL:env(safe-area-inset-left); --safeR:env(safe-area-inset-right);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:var(--bg);color:var(--white);font-family:var(--ui);letter-spacing:-.01em}
canvas{image-rendering:pixelated}
button{font-family:var(--dp);border:none;color:inherit;cursor:pointer}
.hide{display:none !important}
.ot{text-shadow:2px 2px 0 var(--line),-1px -1px 0 var(--line),1px -1px 0 var(--line),-1px 1px 0 var(--line)}

/* ── 3D 버튼 ── */
.b3{position:relative;font-family:var(--dp);font-size:20px;color:#1A1200;padding:13px 20px;border-radius:16px;
    background:linear-gradient(180deg,#FFE27A 0%,var(--yellow) 45%,#F2A900 100%);
    border:3px solid var(--line);box-shadow:0 6px 0 #B47400,0 8px 14px rgba(0,0,0,.45);
    text-shadow:0 1px 0 rgba(255,255,255,.35);transition:transform .06s,box-shadow .06s}
.b3::before{content:"";position:absolute;left:8px;right:8px;top:4px;height:38%;border-radius:10px;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.b3:active{transform:translateY(5px);box-shadow:0 1px 0 #B47400,0 2px 6px rgba(0,0,0,.4)}
.b3:disabled{filter:grayscale(.9) brightness(.6);box-shadow:0 6px 0 #222;transform:none}
.b3.blue{color:#fff;background:linear-gradient(180deg,#7CC7FF,var(--blue) 45%,#1478D2);box-shadow:0 6px 0 #0B4F8F,0 8px 14px rgba(0,0,0,.45);text-shadow:1px 1px 0 var(--line)}
.b3.blue:active{box-shadow:0 1px 0 #0B4F8F}
.b3.green{color:#fff;background:linear-gradient(180deg,#8CF0BD,var(--green) 45%,#1FA86A);box-shadow:0 6px 0 #0E6B41;text-shadow:1px 1px 0 var(--line)}
.b3.green:active{box-shadow:0 1px 0 #0E6B41}
.b3.grey{color:#fff;background:linear-gradient(180deg,#4A5E8A,#2B3C63 50%,#1D2B4A);box-shadow:0 6px 0 #0F1A33;text-shadow:1px 1px 0 var(--line)}
.b3.grey:active{box-shadow:0 1px 0 #0F1A33}
.b3.sm{font-size:14px;padding:8px 13px;border-radius:12px;box-shadow:0 4px 0 #B47400}
.b3.grey.sm{box-shadow:0 4px 0 #0F1A33}

/* ── 패널 ── */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:3px solid var(--line);border-radius:18px;
      box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.12)}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(10,15,30,.75);border:2px solid var(--line);
       border-radius:999px;padding:4px 10px;font-family:var(--dp);font-size:13px}

/* ══ 오프닝 ══ */
.splash{position:fixed;inset:0;z-index:800;background:radial-gradient(900px 500px at 50% 30%,#1E3562,#0B1426 70%);display:grid;place-items:center;overflow:hidden}
.splash.off{display:none}
.splash .rays{position:absolute;inset:-40%;opacity:.12;color:var(--yellow);background:repeating-conic-gradient(from 0deg,currentColor 0 6deg,transparent 6deg 18deg);animation:spin 30s linear infinite}
.splash .logo{position:relative;text-align:center}
.splash .big{font-family:var(--dp);font-size:64px;line-height:1;color:var(--yellow);text-shadow:4px 4px 0 var(--line),0 0 30px rgba(255,201,60,.5)}
.splash .big span{display:inline-block;animation:drop .6s cubic-bezier(.2,1.6,.4,1) both}
.splash .sub{font-family:var(--ui);font-weight:800;letter-spacing:.35em;font-size:13px;color:#fff;margin-top:8px;opacity:0;animation:fadeUp .5s .7s forwards}
.splash .tap{margin-top:26px;font-family:var(--dp);font-size:15px;color:var(--dim);opacity:0;animation:fadeUp .5s 1.1s forwards, pulse 1.2s 1.6s infinite}
@keyframes drop{from{transform:translateY(-120px) rotate(-8deg);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.4}}
.splash canvas{position:absolute;bottom:-4px;width:120px;height:120px;animation:walkIn 1.2s .3s ease-out both}
@keyframes walkIn{from{transform:translateX(-140px);opacity:0}}
.hero{display:flex;gap:28px;justify-content:center;align-items:flex-end;height:120px;margin-top:10px;position:relative}
/* ══ 기습 ══ */
.dodge.amb{background:radial-gradient(circle at 35% 30%,#FF9AA6,var(--red) 55%,#9C1020);box-shadow:0 6px 0 #5E0A14,0 8px 16px rgba(0,0,0,.5);animation:ambPulse .5s infinite}
@keyframes ambPulse{50%{transform:scale(1.08)}}
.locked{position:absolute;inset:0;z-index:3;display:none;place-items:center;background:rgba(80,10,20,.55);border-radius:16px;pointer-events:auto}
.locked.on{display:grid}
.locked b{font-family:var(--dp);font-size:22px;color:#fff;text-shadow:2px 2px 0 var(--line)}
.ambtag{font-family:var(--dp);font-size:14px;color:var(--red);background:rgba(10,15,30,.85);border:2px solid var(--red);border-radius:999px;padding:3px 12px;display:inline-block;margin-bottom:6px}
/* ══ 아이템 카드 ══ */
.slot{cursor:pointer}
.itemcard{position:absolute;right:12px;bottom:112px;width:230px;padding:10px 12px;z-index:8;display:none;animation:bmIn .3s cubic-bezier(.2,1.6,.4,1)}
.itemcard.on{display:block}
.itemcard .ic{font-size:26px}
.itemcard .nm{font-family:var(--dp);font-size:15px;color:var(--yellow)}
.itemcard .ds{font-size:11px;color:#fff;font-weight:700;line-height:1.5;margin-top:3px}
.itemcard .wh{font-size:10px;color:var(--dim);font-weight:700;margin-top:4px}
.bag h4{font-family:var(--dp);font-size:13px;color:var(--yellow);margin:8px 0 4px}
.bag .bi{display:flex;gap:6px;font-size:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08);line-height:1.4}
.bag .bi b{font-family:var(--dp);font-weight:400;color:#fff;font-size:11px}
/* ══ 엔딩 ══ */
.confetti{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.rankup{font-family:var(--dp);font-size:64px;line-height:1;color:var(--yellow);text-shadow:4px 4px 0 var(--line)}
.rankup small{font-size:18px;color:var(--dim)}
.titles{display:flex;flex-wrap:wrap;gap:5px}
.ttl{font-family:var(--dp);font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,201,60,.14);border:2px solid var(--yellow);color:var(--yellow);animation:bmIn .35s cubic-bezier(.2,1.6,.4,1) both}
.ttl.new::after{content:" NEW";font-size:9px;color:var(--green)}
.stk{display:flex;flex-wrap:wrap;gap:4px;font-size:18px}
.stk span{background:rgba(0,0,0,.3);border:2px solid var(--line);border-radius:10px;padding:2px 6px;animation:bmIn .3s both}
.htitle{font-size:10px;font-weight:800;color:var(--teal)}
/* ══ 세로 안내 ══ */
.rotate{position:fixed;inset:0;z-index:900;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center}
.rotate .ico{font-size:58px;animation:tilt 1.6s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
.rotate h2{font-family:var(--dp);font-size:26px;color:var(--yellow)}
.rotate p{font-size:13px;color:var(--dim);line-height:1.8}
@media (orientation:portrait){ .rotate{display:flex} #app{display:none} }
/* 회전 잠금이 풀리지 않는 폰: 앱을 90도 돌려서 강제로 가로 */
body.forceland .rotate{display:none !important}
body.forceland #app{display:flex !important;position:fixed;top:0;left:0;width:100vh;height:100vw;transform-origin:top left;transform:rotate(90deg) translateY(-100vw)}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-left:var(--safeL);padding-right:var(--safeR);
     background:radial-gradient(900px 500px at 50% -10%,#1E3562,transparent 70%),var(--bg)}

/* ══ 캐릭터 만들기 ══ */
.make{flex:1;min-height:0;display:grid;grid-template-columns:minmax(210px,34%) 1fr;gap:12px;padding:10px 12px;overflow:hidden}
.mkL{display:flex;flex-direction:column;gap:8px;min-height:0}
.title{font-family:var(--dp);font-size:24px;line-height:1;color:var(--yellow)}
.title small{display:block;font-family:var(--ui);font-size:10px;color:var(--dim);font-weight:600;letter-spacing:.1em;margin-top:3px}
.stage{padding:10px;display:flex;gap:10px;align-items:center;position:relative;overflow:hidden}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(255,201,60,.16),transparent 60%);pointer-events:none}
.plat{position:relative;width:100px;height:100px;flex-shrink:0;display:grid;place-items:center}
.plat .ring{position:absolute;bottom:6px;width:74px;height:22px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,201,60,.55),rgba(255,201,60,.08) 70%,transparent);border:2px solid rgba(255,201,60,.6)}
#prev{position:relative;width:84px;height:88px}
.stage .info{flex:1;min-width:0;position:relative}
.stage .cls{font-family:var(--dp);font-size:15px;color:var(--yellow)}
.stage .cd{font-size:10px;color:var(--dim);line-height:1.5;margin-top:3px}
.stats{margin-top:6px;display:grid;gap:3px}
.st{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim)}
.st .lb{width:26px}
.st .bar{flex:1;height:7px;background:rgba(0,0,0,.4);border-radius:99px;border:1px solid var(--line);overflow:hidden}
.st .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--yellow))}
input{width:100%;padding:10px 12px;font-size:16px;font-family:var(--dp);background:rgba(0,0,0,.35);color:#fff;
      border:3px solid var(--line);border-radius:14px;user-select:text;-webkit-user-select:text}
input:focus{outline:none;border-color:var(--yellow)}
.rowgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow-y:auto;flex:1;min-height:0;padding-right:3px;touch-action:pan-y}
.rowgrid::-webkit-scrollbar{width:6px}.rowgrid::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:3px}
.row{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.3);border:2px solid var(--line);border-radius:12px;padding:4px 6px}
.row .lb{font-family:var(--dp);font-size:11px;color:var(--dim);width:44px;flex-shrink:0}
.row .val{flex:1;text-align:center;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.row .sw{width:18px;height:18px;border:2px solid var(--line);border-radius:6px;display:inline-block;vertical-align:middle}
.arw{width:28px;height:28px;border-radius:9px;background:linear-gradient(180deg,#3B5288,#22345F);border:2px solid var(--line);
     box-shadow:0 3px 0 #0F1A33;font-size:12px;flex-shrink:0;color:#fff}
.arw:active{transform:translateY(3px);box-shadow:none}
.err{color:var(--red);font-size:11px;min-height:14px;font-weight:700}
.helpbox{position:fixed;inset:0;z-index:80;background:rgba(6,10,20,.96);display:none;padding:14px;overflow-y:auto;touch-action:pan-y}
.helpbox.on{display:block}
.helpbox .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hi{display:flex;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:7px 9px;font-size:11px;color:var(--dim);line-height:1.5}
.hi b{color:#fff;font-family:var(--dp);font-weight:400;font-size:12px}

/* ══ 게임 ══ */
.play{position:absolute;inset:0;display:none}
.play.on{display:block}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:6px 10px;pointer-events:none;z-index:3}
.me{display:flex;align-items:center;gap:7px;background:rgba(10,15,30,.78);border:2px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px}
.me .av{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#2B4270,#14213D);border:2px solid var(--line);display:grid;place-items:center;overflow:hidden}
.me .av canvas{width:26px;height:26px}
.me .nm{font-family:var(--dp);font-size:13px;line-height:1}
.me .rk{font-size:9px;color:var(--dim);font-weight:700}
.timer{margin:0 auto;font-family:var(--dp);font-size:20px;background:rgba(10,15,30,.8);border:2px solid var(--line);border-radius:14px;padding:3px 14px;min-width:78px;text-align:center}
.timer.warn{color:var(--red);animation:beat .5s infinite}
@keyframes beat{0%,100%{transform:scale(1)}45%{transform:scale(1.12)}}
.trophy{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#FFE27A,var(--yellow) 55%,#F2A900);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 8px;color:#1A1200;box-shadow:0 3px 0 #B47400}
.trophy .ic{font-size:15px}
.trophy b{font-family:var(--dp);font-size:18px;font-weight:400;line-height:1}
.trophy small{font-size:9px;font-weight:800;opacity:.75;margin-left:2px}
.teams{position:absolute;left:50%;top:40px;transform:translateX(-50%);display:flex;gap:6px;z-index:3;pointer-events:none}
.tm{font-family:var(--dp);font-size:12px;padding:2px 10px;border-radius:999px;border:2px solid var(--line);background:rgba(10,15,30,.8)}
.badges{position:absolute;left:10px;top:44px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;z-index:3;pointer-events:none}
.bg{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(10,15,30,.8);border:2px solid var(--line);color:var(--dim)}
.bg.on{color:var(--green);border-color:rgba(61,214,140,.5)}
.bg.warn{color:var(--red);border-color:rgba(255,71,87,.6);animation:blink .7s infinite}
@keyframes blink{50%{opacity:.35}}
.toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(10,15,30,.92);border:2px solid var(--yellow);
       border-radius:12px;padding:6px 12px;font-size:11px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:64%;text-align:center;z-index:4}
.toast.on{opacity:1}
.cdbig{position:absolute;inset:0;display:none;place-items:center;background:rgba(6,10,20,.7);z-index:5}
.cdbig.on{display:grid}
.cdbig span{font-family:var(--dp);font-size:96px;color:var(--yellow);animation:cdp .9s infinite}
@keyframes cdp{0%{transform:scale(1.5);opacity:.3}45%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.7}}
.flash{position:absolute;inset:0;pointer-events:none;z-index:90;opacity:0}
.down{position:absolute;inset:0;z-index:40;display:none;place-items:center;background:rgba(40,8,14,.55);pointer-events:none}
.down.on{display:grid}
.down .b{text-align:center}
.down .t{font-family:var(--dp);font-size:40px;color:var(--red);text-shadow:3px 3px 0 var(--line)}
.down .n{font-family:var(--dp);font-size:72px;color:#fff;line-height:1}
.down .s{font-size:12px;color:var(--dim);font-weight:700}
.bigmsg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:45;pointer-events:none;display:none;
  text-align:center;animation:bmIn .35s cubic-bezier(.2,1.6,.4,1)}
.bigmsg.on{display:block}
.bigmsg .ic{font-size:44px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5))}
.bigmsg .nm{font-family:var(--dp);font-size:26px;color:var(--yellow);text-shadow:2px 2px 0 var(--line)}
.bigmsg .ef{font-family:var(--dp);font-size:14px;color:#fff;background:rgba(10,15,30,.85);border:2px solid var(--yellow);border-radius:999px;padding:4px 14px;margin-top:4px;display:inline-block}
@keyframes bmIn{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}
.buff{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(10,15,30,.85);border:2px solid var(--blue);color:#fff;display:flex;gap:5px;align-items:center}
.buff .bar{width:40px;height:5px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.buff .bar i{display:block;height:100%;background:var(--blue)}
.golden{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-family:var(--dp);font-size:13px;color:#1A1200;
        background:linear-gradient(180deg,#FFE27A,var(--yellow));border:2px solid var(--line);border-radius:999px;padding:3px 12px;
        z-index:4;pointer-events:none;animation:gold .6s infinite;display:none}
.golden.on{display:block}
@keyframes gold{50%{filter:brightness(1.25)}}
.qbtn{width:36px;height:30px;border-radius:10px;background:rgba(10,15,30,.85);border:2px solid var(--line);font-size:13px;color:var(--yellow)}
.qpanel{position:absolute;right:12px;top:80px;width:230px;z-index:7;padding:9px;display:none}
.qpanel.on{display:block}
.qpanel h4{font-family:var(--dp);font-size:13px;color:var(--yellow);margin-bottom:6px}
.qi{display:flex;align-items:center;gap:6px;font-size:11px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.qi .nm{flex:1;font-weight:700}
.qi .pg{width:54px;height:6px;background:rgba(0,0,0,.4);border-radius:99px;overflow:hidden}
.qi .pg i{display:block;height:100%;background:var(--green)}
.qi .bn{color:var(--yellow);font-family:var(--dp)}
.qi.done{opacity:.55}.qi.done .nm::after{content:" ✓";color:var(--green)}
.tierbadge{font-size:10px;font-weight:800;color:var(--yellow)}
.lvl{display:flex;align-items:center;gap:6px;margin-top:2px}
.lvl b{font-family:var(--dp);font-size:12px;color:#fff;background:linear-gradient(180deg,#7CC7FF,var(--blue));border:2px solid var(--line);border-radius:8px;padding:0 6px;font-weight:400}
.lvl .xpb{width:70px;height:6px;background:rgba(0,0,0,.45);border-radius:99px;border:1px solid var(--line);overflow:hidden}
.lvl .xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .3s}
.keys{font-family:var(--dp);font-size:12px;color:var(--yellow)}
.zonebn{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);z-index:44;pointer-events:none;display:none;text-align:center}
.zonebn.on{display:block;animation:zb 2.6s ease-out forwards}
.zonebn .n{font-family:var(--dp);font-size:34px;color:#fff;text-shadow:3px 3px 0 var(--line),0 0 24px rgba(255,255,255,.4)}
.zonebn .d{font-family:var(--dp);font-size:13px;color:var(--yellow);text-shadow:2px 2px 0 var(--line)}
@keyframes zb{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.chan{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;pointer-events:none;z-index:4;display:none;
  background:conic-gradient(var(--yellow) var(--p,0%),rgba(255,255,255,.12) 0);border:3px solid var(--line)}
.chan.on{display:block}
.chan::after{content:"열기";position:absolute;inset:8px;border-radius:50%;background:rgba(10,15,30,.85);display:grid;place-items:center;font-family:var(--dp);font-size:12px;color:#fff}
.mini-duel .qcard{border-color:var(--teal)}
.mini-duel .vsintro{display:none !important}
.flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.65}100%{opacity:0}}

/* 조이스틱 */

/* ── 지형 ── */
const SOLID = PX.SOLID;
function loadMap(){
  fetch("/api/map").then(r => r.json()).then(m => {
    const bin = atob(m.tiles), t = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) t[i] = bin.charCodeAt(i);
    MAPI = { ...m, t }; mapCv = true; PX.tileset(m.TS);          // 타일셋만 준비, 보이는 칸만 그립니다
  });
}
loadMap();
const tileAt = (x, y) => { if (!MAPI) return 1; const tx = x / MAPI.TS | 0, ty = y / MAPI.TS | 0;
  if (tx < 0 || ty < 0 || tx >= MAPI.TW || ty >= MAPI.TH) return 3; return MAPI.t[ty * MAPI.TW + tx]; };
const solidAt = (x, y) => SOLID.has(tileAt(x, y));
const R = 13;
const blocked = (x, y) => solidAt(x-R,y-R)||solidAt(x+R,y-R)||solidAt(x-R,y+R)||solidAt(x+R,y+R);

/* ── 내 위치: 예측 + 서버 보정 ── */
const P = { x:0, y:0, init:0, walk:0, face:1 };
const CAM = { x:0, y:0 };
let seq = 0; const pending = []; let zoomPulse = 0;
function speedNow(){
  let sp = 92;
  if (me?.cls === "sling") sp *= 1.12;
  if (F && (F.f & 4)) sp *= 1.5;
  if (F && (F.f & 128)) sp *= 1.6;
  if (tileAt(P.x, P.y) === 6) sp *= .55;
  return sp;
}
function applyInput(inp){
  const len = Math.hypot(inp.x, inp.y);
  if (len < .12) return;
  const sp = speedNow(), ux = inp.x / Math.max(1, len), uy = inp.y / Math.max(1, len);
  if (ux < -.15) P.face = -1; else if (ux > .15) P.face = 1;
  const nx = P.x + ux * sp * inp.dt; if (!blocked(nx, P.y)) P.x = nx;
  const ny = P.y + uy * sp * inp.dt; if (!blocked(P.x, ny)) P.y = ny;
  P.walk += sp * inp.dt;
}

/* ── 다른 사람: 시간 보간 (100ms 뒤를 그려 튐 없음) ── */
const near = new Map();
const LAG = 110;
function pushSnap(v, x, y){ v.buf.push({ t: Date.now(), x, y }); if (v.buf.length > 6) v.buf.shift(); }
function posAt(v, t){
  const b = v.buf; if (!b.length) return { x: v.x, y: v.y };
  if (t <= b[0].t) return b[0];
  for (let i = 1; i < b.length; i++) if (t <= b[i].t) {
    const a = b[i-1], c = b[i], k = (t - a.t) / Math.max(1, c.t - a.t);
    if (Math.hypot(c.x - a.x, c.y - a.y) > 160) return c;        // 포탈 순간이동
    return { x: a.x + (c.x - a.x) * k, y: a.y + (c.y - a.y) * k };
  }
  return b[b.length - 1];
}

  buzz(40); SFX.play("portal"); spark(cv.clientWidth/2, cv.clientHeight/2, "#B39CFF", 22, 3);
  flash("radial-gradient(circle,rgba(155,92,255,.45),transparent 72%)"); toast("🌀 순간이동!", 1400); });
socket.on("me", (f) => {
  F = f;
  // 서버가 확인한 위치에서 시작해, 아직 확인 안 된 입력만 다시 얹습니다
  const sx = f.x, sy = f.y;
  if (!P.init) { P.x = sx; P.y = sy; CAM.x = sx; CAM.y = sy; P.init = 1; }
  else {
    while (pending.length && pending[0].s <= f.ack) pending.shift();
    const px = P.x, py = P.y;
    P.x = sx; P.y = sy;
    for (const inp of pending) applyInput(inp);
    // 아주 작은 차이는 부드럽게, 큰 차이(포탈·밀림)는 그대로
    const d = Math.hypot(P.x - px, P.y - py);
    if (d < 14) { P.x = px + (P.x - px) * .35; P.y = py + (P.y - py) * .35; }
  }
  const seen = new Set();
  f.n.forEach(a => {
    seen.add(a[0]);
    let v = near.get(a[0]);
    if (!v) near.set(a[0], (v = { x:a[1], y:a[2], buf:[] }));
    pushSnap(v, a[1], a[2]);
    v.fl = a[3]; v.wk = a[4]; v.fc = a[5]; v.tm = a[6]; v.tier = a[7] | 0; v.em = a[8] | 0; v.lv = a[9] | 1;
  });
  (f.bosses || []).forEach(b => { const k = -100 - b[5]; seen.add(k);
    let v = near.get(k); if (!v) near.set(k, (v = { x:b[0], y:b[1], buf:[], boss:b[4] }));
    pushSnap(v, b[0], b[1]); v.wk = b[2]; v.fc = b[3]; v.boss = b[4]; v.dash = b[7];
    if (!seenBoss.has(b[5] + ":" + b[4])) { seenBoss.add(b[5] + ":" + b[4]); if (seenBoss.size > 2) popBoss.set(k, Date.now()); } });

  o.querySelectorAll(".tab").forEach(b => b.onclick = () => { o.querySelectorAll(".tab").forEach(x => x.classList.remove("on")); o.querySelectorAll(".pane").forEach(x => x.classList.remove("on")); b.classList.add("on"); $("p" + b.dataset.p).classList.add("on"); });
  o.classList.add("on");
  // 순위 숫자 카운트다운 + 컨페티
  let cur = e.total, tick = 0; const ru = $("rankup");
  const iv = setInterval(() => { cur = Math.max(e.rank, cur - Math.max(1, Math.ceil((cur - e.rank) / 6))); ru.innerHTML = `${cur}<small>위 / ${e.total}명</small>`; SFX.play("tick"); if (cur <= e.rank) { clearInterval(iv); SFX.play(e.rank <= 3 ? "fanfare" : "win"); } }, 90);
  const cf = $("confetti"); const cols = ["#FFC93C","#3DD68C","#FF4757","#2FA4FF","#9B5CFF","#fff"];
  for (let i = 0; i < (e.rank <= 3 ? 90 : 40); i++) { const p = document.createElement("i"); p.style.left = Math.random()*100 + "%"; p.style.background = cols[i % cols.length];
    p.style.animationDuration = (2 + Math.random()*2) + "s"; p.style.animationDelay = (Math.random()*1.5) + "s"; p.style.transform = `rotate(${Math.random()*360}deg)`; cf.appendChild(p); }
});
</script>
